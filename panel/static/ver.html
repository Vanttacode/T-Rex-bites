<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ver T-Rex Bites</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <style>
    :root { --accent: #ff8a1f; --muted: #a9abc9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #f3f1e8;
      font-family: "Segoe UI", "DejaVu Sans", system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    .screen { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
      background: radial-gradient(circle, #1b1f3b, #000); }
    .msg[hidden] { display: none; }
    .msg b { color: var(--accent); font-size: 1.4rem; }
    .bug { position: absolute; top: 12px; right: 16px; font-weight: bold; color: #fff; opacity: 0.8;
      text-shadow: 0 0 4px #000; pointer-events: none; }
    .bar { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; background: #12142b;
      border-top: 2px solid var(--accent); }
    .bar a, .bar button { flex: none; font: inherit; color: #f3f1e8; background: #2a2f5c; border: 0;
      border-radius: 10px; padding: 10px 14px; text-decoration: none; cursor: pointer; }
    .bar button.on { background: var(--accent); color: #241200; font-weight: bold; }
    .play { font: inherit; font-size: 1.2rem; background: var(--accent); color: #241200; border: 0;
      border-radius: 14px; padding: 14px 22px; font-weight: bold; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="screen" id="screen">
    <video id="video" playsinline></video>
    <div class="bug" id="bug"></div>
    <div class="msg" id="msg"><div><b>T-Rex Bites</b><p id="msg-text">Elige un canal abajo.</p>
      <button class="play" id="play" hidden>▶ Ver</button></div></div>
  </div>
  <nav class="bar" id="bar"><a href="/">← Panel</a></nav>
  <script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const video = $("video");
  const st = { channel: null, channels: [], timer: null, url: null };

  async function api(path) {
    const r = await fetch(path, { credentials: "same-origin" });
    if (r.status === 401) { location.href = "/"; throw new Error("login"); }
    if (!r.ok) throw new Error("Error " + r.status);
    return r.json();
  }

  function message(text, showPlay) {
    $("msg").hidden = !text;
    $("msg-text").textContent = text || "";
    $("play").hidden = !showPlay;
  }

  // ask the TV what this channel is showing now, and jump to the same second
  async function tune() {
    clearTimeout(st.timer);
    if (!st.channel) return;
    let r;
    try { r = await api(`/api/watch/${encodeURIComponent(st.channel.name)}`); }
    catch (e) { message("La tele no responde. Reintentando…"); st.timer = setTimeout(tune, 10000); return; }
    $("bug").textContent = `${st.channel.number} · ${r.long_name}`;
    if (!r.playing) {
      video.pause();
      video.removeAttribute("src");
      st.url = null;
      message("📺 Este canal está fuera del aire ahora.");
      st.timer = setTimeout(tune, 30000);
      return;
    }
    const p = r.playing;
    if (st.url !== p.url) { st.url = p.url; video.src = p.url; }
    const seek = () => { try { video.currentTime = p.offset; } catch (_) { /* not ready */ } };
    if (video.readyState >= 1) seek(); else video.addEventListener("loadedmetadata", seek, { once: true });
    try { await video.play(); message(""); }
    catch (_) { message(p.title ? `Ahora: ${p.title}` : "Listo para ver", true); }
    // check again when this part should end (a commercial, the next program…)
    st.timer = setTimeout(tune, Math.max(2, p.remaining) * 1000 + 500);
  }

  function pick(ch) {
    st.channel = ch;
    st.url = null;
    document.querySelectorAll(".bar button").forEach((b) => b.classList.toggle("on", b.dataset.name === ch.name));
    history.replaceState(null, "", `/ver?canal=${ch.number}`);
    message("Sintonizando…");
    tune();
  }

  video.addEventListener("ended", tune);
  video.addEventListener("error", () => { if (st.url) { message("Este video no se puede ver en el navegador. Activa \"Convertir videos\" en el panel."); st.timer = setTimeout(tune, 15000); } });
  $("play").addEventListener("click", () => { message(""); tune(); });
  $("screen").addEventListener("dblclick", () => { if (document.fullscreenElement) document.exitFullscreen(); else $("screen").requestFullscreen?.(); });

  (async function start() {
    const data = await api("/api/channels");
    st.channels = data.channels;
    for (const ch of st.channels) {
      const b = document.createElement("button");
      b.dataset.name = ch.name;
      b.textContent = `${ch.number} · ${ch.long_name}`;
      b.addEventListener("click", () => pick(ch));
      $("bar").append(b);
    }
    const want = Number(new URLSearchParams(location.search).get("canal"));
    const first = st.channels.find((c) => c.number === want);
    if (first) pick(first);
  })().catch(() => message("No se pudo cargar la lista de canales."));
  </script>
</body>
</html>
