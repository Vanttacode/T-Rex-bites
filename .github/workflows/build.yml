name: Pruebas y USB de instalación

# - On every push and pull request: run the panel tests and lint the scripts.
# - On a version tag (v1.0.0, v1.1.0, ...), or a push whose commit message
#   contains "[release]" (version taken from the VERSION file): also build the
#   offline USB image and publish it as a GitHub Release, ready to download and
#   write with balenaEtcher. Versions with a dash (0.1.0-beta) are pre-releases.
# - "Run workflow" button (Actions tab): build the image as a downloadable
#   artifact without publishing a release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas del panel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r panel/requirements.txt -r panel/requirements-dev.txt

      - name: Pruebas
        working-directory: panel
        run: python -m pytest -q

      - name: Revisar scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -x -e SC1091 system/install-trexbites.sh system/trexbites-update.sh system/agregar-al-menu.sh iso/build-iso.sh iso/build-offline-payload.sh

  iso:
    name: USB de instalación (sin internet)
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q xorriso

      - name: Construir trexbites.iso
        run: ./iso/build-iso.sh

      - name: Nombre con versión
        id: name
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]] && grep -qF '[release]' <<< "$HEAD_MESSAGE"; then
            version="v$(tr -d '[:space:]' < VERSION)"
            publish=true
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          file="trexbites-${version}.iso"
          mv iso/out/trexbites.iso "iso/out/$file"
          (cd iso/out && sha256sum "$file" > "$file.sha256")
          size=$(stat -c %s "iso/out/$file")
          echo "Tamaño: $((size / 1024 / 1024)) MB"
          # GitHub Releases accepts files up to 2 GiB
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::La imagen pesa más de 2 GB y GitHub no la aceptaría como descarga."
            exit 1
          fi
          {
            echo "file=$file"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Paquete de actualización
        if: steps.name.outputs.publish == 'true'
        env:
          VERSION_TAG: ${{ steps.name.outputs.version }}
        run: |
          # what "Actualizar" in the panel downloads: program files only,
          # installed online (videos and settings on the TV are kept)
          stage=$(mktemp -d)
          cp -r upstream system "$stage/"
          mkdir -p "$stage/panel"
          cp -r panel/trexbites_panel panel/static panel/requirements.txt "$stage/panel/"
          echo "${VERSION_TAG#v}" > "$stage/VERSION"
          find "$stage" -name __pycache__ -prune -exec rm -rf {} +
          bundle="trexbites-update-${VERSION_TAG}.tar.gz"
          tar -czf "iso/out/$bundle" -C "$stage" .
          (cd iso/out && sha256sum "$bundle" > "$bundle.sha256")

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: |
            iso/out/${{ steps.name.outputs.file }}
            iso/out/${{ steps.name.outputs.file }}.sha256
          retention-days: 14
          compression-level: 0

      - name: Publicar versión
        if: steps.name.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: T-Rex Bites ${{ steps.name.outputs.version }}
          # versions like v0.1.0-beta are published as test versions
          prerelease: ${{ contains(steps.name.outputs.version, '-') }}
          files: |
            iso/out/${{ steps.name.outputs.file }}
            iso/out/${{ steps.name.outputs.file }}.sha256
            iso/out/trexbites-update-${{ steps.name.outputs.version }}.tar.gz
            iso/out/trexbites-update-${{ steps.name.outputs.version }}.tar.gz.sha256
          body: |
            ## 🦖📺 T-Rex Bites ${{ steps.name.outputs.version }}

            **Descarga `${{ steps.name.outputs.file }}`** y grábala en un USB de 4 GB o más con
            [balenaEtcher](https://etcher.balena.io/).

            - Se instala **sin internet**: el USB trae todo.
            - En el menú del USB eliges cómo instalar:
              - **Instalar T-Rex Bites**: ⚠️ borra todo el disco (computador dedicado a la tele).
              - **Instalar al lado de otro Linux** (Fedora, Ubuntu…): usa solo el espacio sin asignar;
                después agrega T-Rex Bites al menú de tu Linux con `system/agregar-al-menu.sh`.
              - **Instalar al lado de Windows**: usa solo el espacio sin asignar.
            - ¿Ya tienes T-Rex Bites? Actualiza desde el panel: **Más → Actualizaciones**
              (`trexbites-update-*.tar.gz` es ese paquete; no hace falta descargarlo).
            - Guía completa en el [README](https://github.com/${{ github.repository }}#readme).

            Para verificar la descarga: `sha256sum -c ${{ steps.name.outputs.file }}.sha256`
